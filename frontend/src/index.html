<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <title>MotoRepuestos | Repuestos y accesorios para tu moto</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Repuestos, accesorios e indumentaria para motos. Retiro en local y pagos con tarjeta o transferencia.">
  <meta name="theme-color" content="#ea580c">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before Angular boots to avoid a light/dark flash.
    (function () {
      try {
        var saved = localStorage.getItem('mr_theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>
</head>
<body>
  <app-root>
    <!-- Shown until Angular boots; restoring a session may wait for a sleeping server to wake up. -->
    <div class="boot-splash" role="status">
      <span class="boot-spinner"></span>
      <div class="boot-slow">
        <p class="boot-title">Despertando el servidor…</p>
        <p>La primera carga puede tardar hasta un minuto.</p>
      </div>
    </div>
  </app-root>
</body>
</html>
