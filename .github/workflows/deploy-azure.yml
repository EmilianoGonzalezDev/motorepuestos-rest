# Test, build and deploy the API + Angular SPA to Azure App Service (Linux) on every push to main.
# The SPA is copied into the API's wwwroot, so both are served from the same origin.
# Requires repo secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credential
# for branch main) and repo variable AZURE_WEBAPP_NAME. Without that variable the deploy job is skipped.

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      # ReadyToRun precompiles the app, so cold starts on the Free plan use less CPU.
      - name: Publish API
        run: >
          dotnet publish backend/src/MotoRepuestos.Api/MotoRepuestos.Api.csproj -c Release -o publish
          -r linux-x64 --self-contained false -p:PublishReadyToRun=true -p:UseAppHost=false

      - name: Add the SPA to wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/motorepuestos-web/browser/. publish/wwwroot/
          test -f publish/wwwroot/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    # No "environment:" on purpose: it changes the OIDC subject and the branch federated credential stops matching.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
